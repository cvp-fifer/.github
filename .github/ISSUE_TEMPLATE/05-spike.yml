# NOTE: `type: markdown` blocks render only in the web form — they NEVER appear
# in the submitted issue body. The durable AI-section marker is the "🤖 " prefix
# on field labels. Do not rely on a rendered divider.
#
# Editing this file? Regenerate the CLI skeletons: uv run scripts/gen_issue_bodies.py
name: Spike / Research
description: Timeboxed investigation that informs a decision.
type: Spike
labels: ["spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: The decision this spike informs, phrased as a question.
    validations:
      required: true
  - type: dropdown
    id: timebox
    attributes:
      label: Timebox
      options:
        - 2 hours
        - Half day
        - 1 day
        - 2–3 days
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      placeholder: ADR draft, recommendation comment, or prototype branch.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **🤖 AI Agent Context** — optional; fill in what you know.
  - type: textarea
    id: starting_points
    attributes:
      label: 🤖 Starting points
      placeholder: Links, prior art, code to read first.
